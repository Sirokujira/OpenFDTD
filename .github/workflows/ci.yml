# OpenFDTD (処理ロジック) CI — 各実装のビルド + 実サンプルのスモーク実行。
#
#   build-cpu / build-macos / build-windows … CPU 版 (ofd, ofd_post) を 3 OS で
#   build-mpi                               … ofd_mpi (並列実行の一致まで検証)
#   build-cuda                              … ofd_cuda / ofd_cuda_mpi
#
# ランナーに GPU は無いが、CUDA 版はセル毎の演算が __host__ __device__ の
# 共通関数なので -cpu 実行 (GPU を使わない実行モード) で物理まで判定できる。
# 実機 GPU でのカーネル起動構成のみ未検証 (self-hosted ランナー導入時に拡張)。
name: CI

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libhdf5-dev

      - name: Configure (CPU only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF

      - name: Build ofd / ofd_post
        run: cmake --build build -j"$(nproc)"

      - name: Smoke test — solver (dipole sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/dipole.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/ofd" -n 2 dipole.ofd
          grep -q "normal end" ofd.log
          test -s ofd.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/ofd_post" -n 2 dipole.ofd

      # TPA (二光子吸収) : 振幅 3 点を掃引し解析解 T=1/(1+β I0 L) と比較 (±7%)
      - name: Validation test — TPA slab
        run: sh data/sample/tpa_slab_check.sh "$GITHUB_WORKSPACE/bin/ofd" /tmp/smoke-tpa

      # 熱解析レイヤ : 発熱密度がセル毎の材料を参照していることの検証
      # (熱解析レイヤは CPU 版のみなので build-mpi / build-cuda では実行しない)
      - name: Validation test — thermal per-cell material
        run: sh data/sample/thermal_material_check.sh "$GITHUB_WORKSPACE/bin/ofd" /tmp/smoke-thermal

      # 平面波励振 : 完全導体球の散乱断面積を Mie 厳密解と比較する。
      # 平面波の波源設定が壊れると断面積が 0 や NaN になるが "normal end" では
      # 終わるため、スモークテストでは検出できない (実際に長期間見逃していた)。
      # 2 分ほどかかるので Linux ジョブのみで実行する。
      - name: Validation test — plane wave RCS (PEC sphere vs Mie)
        run: sh data/sample/sphere_rcs_check.sh "$GITHUB_WORKSPACE/bin/ofd" /tmp/smoke-rcs

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ofd-linux-x64
          path: |
            bin/ofd
            bin/ofd_post

      # タグ (v*) push 時は Release にバイナリを添付する。
      # OpenFDTD-X (GUI) や統合テストはここから取得できる (公開リポジトリ)。
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf ofd-linux-x64.tar.gz -C bin ofd ofd_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ofd-linux-x64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-tpa/*.log
            /tmp/smoke-thermal/*.log
            /tmp/smoke-rcs/*.log
          if-no-files-found: ignore

  # macOS (Apple Silicon)。AppleClang は OpenMP を同梱しないため、
  # Homebrew の libomp を明示指定して find_package(OpenMP) を通す。
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libomp hdf5

      - name: Configure (CPU only)
        run: |
          OMP="$(brew --prefix libomp)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${OMP}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I${OMP}/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${OMP}/lib/libomp.dylib"

      - name: Build ofd / ofd_post
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test — solver (dipole sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/dipole.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/ofd" -n 2 dipole.ofd
          grep -q "normal end" ofd.log
          test -s ofd.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/ofd_post" -n 2 dipole.ofd

      # TPA (二光子吸収) : 振幅 3 点を掃引し解析解 T=1/(1+β I0 L) と比較 (±7%)
      - name: Validation test — TPA slab
        run: sh data/sample/tpa_slab_check.sh "$GITHUB_WORKSPACE/bin/ofd" /tmp/smoke-tpa

      # 熱解析レイヤ : 発熱密度がセル毎の材料を参照していることの検証
      # (熱解析レイヤは CPU 版のみなので build-mpi / build-cuda では実行しない)
      - name: Validation test — thermal per-cell material
        run: sh data/sample/thermal_material_check.sh "$GITHUB_WORKSPACE/bin/ofd" /tmp/smoke-thermal

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ofd-macos-arm64
          path: |
            bin/ofd
            bin/ofd_post

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf ofd-macos-arm64.tar.gz -C bin ofd ofd_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ofd-macos-arm64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-macos
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-tpa/*.log
            /tmp/smoke-thermal/*.log
          if-no-files-found: ignore

  # Windows (MSVC)。依存は vcpkg (x64-windows-static-md 静的リンク) で導入し、
  # DLL 同梱不要の自己完結 exe を生成する。ビルドは MSVC 環境 + Ninja。
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      # hdf5 の既定機能 szip は libaec を gitlab.dkrz.de から取得するが
      # 429 で落ちることがあるため、必要な core+zlib のみに絞る
      - name: Install dependencies (vcpkg)
        run: vcpkg install "hdf5[core,zlib]:x64-windows-static-md" --recurse

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CPU only)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DWITH_CUDA=OFF -DWITH_MPI=OFF
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build ofd / ofd_post
        run: cmake --build build

      - name: Smoke test — solver (dipole sample)
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item data/sample/dipole.ofd smoke/
          Set-Location smoke
          & "$env:GITHUB_WORKSPACE\bin\ofd.exe" -n 2 dipole.ofd
          Write-Host ("ofd exit code: 0x{0:X8}" -f $LASTEXITCODE)
          if (Test-Path ofd.log) { Get-Content ofd.log -Tail 5 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path ofd.log -Pattern "normal end" -Quiet)) { Write-Error "no normal end"; exit 1 }
          if ((Get-Item ofd.out).Length -eq 0) { Write-Error "empty ofd.out"; exit 1 }
          & "$env:GITHUB_WORKSPACE\bin\ofd_post.exe" -n 2 dipole.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # TPA (二光子吸収) : 振幅 3 点を掃引し解析解 T=1/(1+β I0 L) と比較 (±7%)
      # (期待値の導出は data/sample/tpa_slab.ofd のコメント参照)
      - name: Validation test — TPA slab
        run: |
          $cases = @(@("5.0e7", 0.882830), @("1.0e8", 0.653217), @("1.5e8", 0.455687))
          $src = Get-Content data/sample/tpa_slab.ofd
          New-Item -ItemType Directory -Force smoke-tpa | Out-Null
          Set-Location smoke-tpa
          $fail = $false
          foreach ($c in $cases) {
            $amp = $c[0]; $texp = [double]$c[1]
            ($src -replace '^waveamp = .*', "waveamp = $amp") | Set-Content tpa_run.ofd
            & "$env:GITHUB_WORKSPACE\bin\ofd.exe" -n 2 tpa_run.ofd | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "ofd failed (waveamp=$amp)"; exit 1 }
            $line = (Select-String -Path ofd.log -Pattern "TPA: transmission").Line | Select-Object -Last 1
            if (-not $line) { Write-Error "no 'TPA: transmission' line in ofd.log"; exit 1 }
            $t = [double](($line -split ' ')[3])
            $err = [math]::Abs(($t - $texp) / $texp)
            Write-Host ("waveamp={0} T_fdtd={1} T_analytic={2} err={3:P2}" -f $amp, $t, $texp, $err)
            if ($err -gt 0.07) { $fail = $true }
          }
          Set-Location ..
          if ($fail) { Write-Error "TPA validation failed (tolerance 7%)"; exit 1 }
          Write-Host "TPA validation passed (tolerance 7%)"

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ofd-windows-x64
          path: |
            bin/ofd.exe
            bin/ofd_post.exe

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path bin/ofd.exe, bin/ofd_post.exe -DestinationPath ofd-windows-x64.zip

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ofd-windows-x64.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-windows
          path: |
            smoke/*.log
            smoke-rcwa/*.log
            smoke-tpa/*.log
          if-no-files-found: ignore

  # MPI 版 (ofd_mpi) のビルドと並列実行の検証。
  # 以前は CPU 版しかビルドしていなかったため、MPI ビルドが壊れていること
  # (存在しないソースの参照・並列 HDF5 前提のコード・入力の配り忘れによる
  # デッドロック) に長期間気付けなかった。ここで恒常的に検証する。
  # 並列 HDF5 は不要 (rank 0 が直列ドライバで書く) なので libhdf5-dev で足りる。
  build-mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libhdf5-dev libopenmpi-dev openmpi-bin

      - name: Configure (MPI)
        run: cmake -B build-mpi -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=ON

      - name: Build ofd_mpi / ofd_post
        run: cmake --build build-mpi -j"$(nproc)"

      # 1 プロセスと 2 プロセスで結果が完全一致すること
      # (dipole は TPA を使わないので、並列化そのものの回帰検出になる)
      - name: Smoke test — dipole (1 and 2 processes)
        run: |
          mkdir -p /tmp/mpi-smoke && cp data/sample/dipole.ofd /tmp/mpi-smoke/
          cd /tmp/mpi-smoke
          mpirun --oversubscribe -n 1 "$GITHUB_WORKSPACE/bin/ofd_mpi" -p 1 1 1 -n 1 dipole.ofd
          grep -q "normal end" ofd.log
          grep -A3 "input impedance" ofd.log | tail -1 > zin1.txt
          mpirun --oversubscribe -n 2 "$GITHUB_WORKSPACE/bin/ofd_mpi" -p 1 1 2 -n 1 dipole.ofd
          grep -q "normal end" ofd.log
          grep -A3 "input impedance" ofd.log | tail -1 > zin2.txt
          diff zin1.txt zin2.txt

      # 領域分割の取り方によらず TPA の結果が一致すること (ハロー交換・
      # comm_broadcast の漏れを検出する。2 プロセス以上でのハングもここで落ちる)
      - name: Validation test — TPA decomposition invariance
        run: sh data/sample/tpa_decomp_check.sh "$GITHUB_WORKSPACE/bin/ofd_mpi" /tmp/mpi-decomp

      # 解析解との比較 (CPU 版と同じスクリプト・同じ期待値を 2 プロセスで実行)
      - name: Validation test — TPA slab (2 processes)
        env:
          OFD_LAUNCHER: mpirun --oversubscribe -n 2
          OFD_ARGS: -p 1 1 2
        run: sh data/sample/tpa_slab_check.sh "$GITHUB_WORKSPACE/bin/ofd_mpi" /tmp/mpi-tpa

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-mpi
          path: |
            /tmp/mpi-smoke/*.log
            /tmp/mpi-decomp/*.log
            /tmp/mpi-tpa/*.log
          if-no-files-found: ignore

  # CUDA 版 (ofd_cuda) と CUDA+MPI 版 (ofd_cuda_mpi) のビルド検証。
  # ランナーに GPU は無いが、
  #   - nvcc でのコンパイル・リンクは通せる (ビルドリストの取りこぼしを検出)
  #   - セル毎の演算は __host__ __device__ の共通関数なので、-cpu 実行
  #     (GPU を使わない実行モード) で物理の正しさまで判定できる
  # ため、GPU 無しランナーでも実質的な回帰検出になる。
  # 実機 GPU でのカーネル起動構成は依然として未検証 (self-hosted 導入時に拡張)。
  #
  # ubuntu-24.04 に固定する : distro の nvidia-cuda-toolkit (CUDA 12.0) は
  # 同じ distro の gcc (13) を受け付けるようパッチされている組み合わせで、
  # ubuntu-latest が次の LTS に上がると nvcc がホストコンパイラを拒否しうる。
  build-cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libhdf5-dev nvidia-cuda-toolkit \
                                  libopenmpi-dev openmpi-bin
          nvcc --version

      - name: Configure / build (CUDA)
        run: |
          cmake -B build-cuda -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=ON -DWITH_MPI=OFF
          cmake --build build-cuda --target ofd_cuda -j"$(nproc)"

      - name: Validation test — TPA slab (ofd_cuda, CPU execution mode)
        env:
          OFD_ARGS: -cpu
        run: sh data/sample/tpa_slab_check.sh "$GITHUB_WORKSPACE/bin/ofd_cuda" /tmp/cuda-tpa

      - name: Configure / build (CUDA + MPI)
        run: |
          cmake -B build-cuda-mpi -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=ON -DWITH_MPI=ON
          cmake --build build-cuda-mpi --target ofd_cuda_mpi -j"$(nproc)"

      - name: Validation test — TPA decomposition invariance (ofd_cuda_mpi)
        run: sh data/sample/tpa_decomp_check.sh "$GITHUB_WORKSPACE/bin/ofd_cuda_mpi" /tmp/cuda-mpi-decomp -cpu

      - name: Validation test — TPA slab (ofd_cuda_mpi, 2 processes)
        env:
          OFD_LAUNCHER: mpirun --oversubscribe -n 2
          OFD_ARGS: -cpu -p 1 1 2
        run: sh data/sample/tpa_slab_check.sh "$GITHUB_WORKSPACE/bin/ofd_cuda_mpi" /tmp/cuda-mpi-tpa

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-cuda
          path: |
            /tmp/cuda-tpa/*.log
            /tmp/cuda-mpi-decomp/*.log
            /tmp/cuda-mpi-tpa/*.log
          if-no-files-found: ignore
